<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="mobile-web-app-capable" content="yes">
<title>Suivi des cours</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --navy:#0B1F3A; --navy2:#10294A; --navy3:#16345C;
  --text:#EEF2F8; --muted:#8EA0BD; --line:rgba(255,255,255,.08);
  --gold:#C9A24B; --up:#3FCF8E; --down:#FF7266;
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--navy);color-scheme:dark}
body{font-family:var(--sans);color:var(--text);background:var(--navy);height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;max-width:820px;margin:0 auto;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:6px}

.top{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--gold);flex:none}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.1}
.icons{display:flex;gap:2px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.ib:active{background:var(--navy3);color:var(--text)}
.ib svg{width:21px;height:21px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
#status{font-size:12px;color:var(--muted);line-height:1.35;min-width:0}
#status.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--up);margin-right:6px;vertical-align:1px}
#mode{flex:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--navy2);color:var(--gold)}

.tw{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px;letter-spacing:-.2px}
table.full{table-layout:auto;width:max-content;min-width:100%}
th,td{padding:0 3px;white-space:nowrap}
th{position:sticky;top:0;z-index:3;height:38px;background:var(--navy3);color:var(--muted);font-size:11.5px;
  font-weight:600;text-align:right;border-bottom:1px solid var(--gold);user-select:none}
th.sortable{cursor:pointer}
th.on{color:var(--gold)}
td{height:40px;border-bottom:1px solid var(--line);text-align:right}
.c1{position:sticky;left:0;z-index:2;text-align:left;width:78px;padding-left:9px;background:var(--navy);
  border-right:1px solid var(--line)}
th.c1{z-index:4;background:var(--navy3)}
.c1 b{display:block;font-size:13.5px;letter-spacing:.2px;line-height:1.15}
.c1 small{display:block;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  max-width:68px;line-height:1.2;margin-top:1px}
.nm{text-align:left;color:var(--muted);min-width:230px}
.pp{color:var(--muted);min-width:84px}
.px{font-weight:600}
td.v{font-weight:700;font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)} .nd{color:var(--muted);font-style:italic;font-weight:400}
table:not(.full) .pp, table:not(.full) .nm{display:none}
table.full .c1{min-width:132px}
table.full .c1 small{max-width:118px}
table.full th,table.full td{padding:0 12px;letter-spacing:0}
table.full .v,table.full th.sortable,table.full .px{min-width:78px}
table.full td.v{font-size:12.5px}

tfoot td{position:sticky;z-index:3;height:28px;background:var(--navy2);font-weight:700;font-size:12px;border-bottom:0}
tfoot tr:nth-child(1) td{bottom:56px;border-top:2px solid var(--gold)}
tfoot tr:nth-child(2) td{bottom:28px}
tfoot tr:nth-child(3) td{bottom:0}
tfoot td.c1{z-index:4;background:var(--navy2);color:var(--muted);font-weight:600;border-right:1px solid var(--line)}

.sc{text-align:left;white-space:normal;min-width:250px;max-width:320px;line-height:1.25;font-size:11.5px;color:var(--muted)}
th.sc{white-space:nowrap}
table:not(.full) .sc,table:not(.full) .bp,table:not(.full) .gp{display:none}
table.full .bs{display:none}
.px{line-height:1.15}
.bs{display:block;font-size:10px;font-weight:500;color:var(--gold);margin-top:1px;letter-spacing:0}
.bs.in{color:var(--up);font-weight:700}
.bp{font-weight:600;color:var(--gold)}
.gp{font-weight:700}
.wait{color:var(--gold)}
tr.buyz .c1{box-shadow:inset 3px 0 0 var(--up)}
table:not(.full) tbody tr[data-t]{cursor:pointer}
tr.dt td{height:auto;padding:0;background:var(--navy2);letter-spacing:0}
tr.dt td>div{padding:9px 12px;white-space:normal;text-align:left;font-size:12px;line-height:1.4;position:sticky;left:0;max-width:390px}
tr.dt p+p{margin-top:4px}
tr.dt span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:1px}

.empty{padding:28px 20px;color:var(--muted);font-size:14px;line-height:1.5;white-space:normal;text-align:left}

dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;border-radius:20px 20px 0 0;
  background:var(--navy2);color:var(--text);padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(3,10,22,.65)}
dialog h2{font-family:var(--serif);font-size:20px;margin-bottom:8px}
dialog p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
dialog label{display:block;font-size:13px;margin-bottom:6px}
dialog input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--navy);
  color:var(--text);font:inherit;font-size:14px}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:12px;border-radius:10px;font-weight:600;background:var(--navy3)}
.btns .main{background:var(--gold);color:var(--navy)}
#install{display:none;width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);font-weight:600}
#err{color:var(--down);font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body>

<header class="top">
  <div class="bar1">
    <h1>Suivi des cours</h1>
    <div class="icons">
      <button class="ib" id="refresh" aria-label="Actualiser les cours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="ib" id="gear" aria-label="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="bar2">
    <p id="status" aria-live="polite"></p>
    <button id="mode">Tous les prix</button>
  </div>
</header>

<div class="tw" id="tw">
  <table id="tbl">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</div>

<dialog id="dlg">
  <h2>Réglages</h2>
  <p>Lien CSV de ton Google Sheet (déjà renseigné). Pour en changer : Fichier, Partager, Publier sur le web, format CSV. Laisse vide pour revenir au lien par défaut.</p>
  <label for="url">Lien CSV</label>
  <input id="url" type="url" inputmode="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv" autocomplete="off">
  <div id="err" role="alert"></div>
  <div class="btns">
    <button id="cancel">Annuler</button>
    <button id="save" class="main">Enregistrer</button>
  </div>
  <button id="install">Installer l'appli sur l'écran d'accueil</button>
</dialog>

<script>
const DEFAULT_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOSr_VY1h2740L22ABzr75LNq0tRP1TGdxgY-WZE-Cj7FPN21hzeQ0PeYak8EzWiWsjss7T9t3uk4d/pub?gid=0&single=true&output=csv';
const SNAPSHOT = [["ETN", "Eaton", 425.49, 431.33, 403.36, 375.37, 199.64], ["EXEL", "Exelixis", 59.73, 58.44, 44.96, 38.44, 19.61], ["FSLR", "First Solar", 178.98, 180.13, 200.35, 226.15, 155.9], ["PAVE", "Global X U.S. Infrastructure Development ETF", 49.54, 49.67, 50.67, 43.9, 26.45], ["AINF", "iShares AI Infrastructure UCITS ETF", 20.97, 20.97, null, null, null], ["SEMI", "iShares MSCI Global Semiconductor ETF", 40.95, 41.16, 32.27, 31.71, 18.37], ["MRVL", "Marvell Technology", 272.38, 284.68, 131.3, 89.39, 49.49], ["NBIS", "Nebius NV", 219.74, 237.15, 154.56, 135.46, null], ["POWL", "Powell Industries", 191.61, 197.74, 228.99, 105.33, 24.7], ["PRY", "Prysmian", 122.3, 124.3, 119.7, 88.62, 34.62], ["RKLB", "Rocket Lab", 68.59, 71.92, 70.62, 65.42, 4.14], ["NOW", "ServiceNow Inc", 138.8, 137.87, 89.06, 184.74, 110.88], ["SKHY", "SK hynix", 170.21, 178.25, null, null, null], ["SPCX", "SpaceX", 161.97, 167.6, null, null, null], ["VRT", "Vertiv Holdings Co", 244, 246.49, 299.96, 179, 39.03], ["VST", "Vistra Energy", 157.32, 166.72, 158.2, 209.55, 32.7], ["COHR", "Coherent", null, null, null, null, null], ["LITE", "Lumentum", null, null, null, null, null], ["TYO:6324", "Harmonic Drive System", null, null, null, null, null], ["TYO:6954", "Fanuc", null, null, null, null, null], ["SYM", "Symbotic", null, null, null, null, null]];
const META = {"ETN": ["Électrification, distribution électrique, data centers", 350], "EXEL": ["Biotechnologie, oncologie", null], "FSLR": ["Énergie solaire, panneaux photovoltaïques", 145], "PAVE": ["Infrastructures américaines, construction, électrification", 40], "AINF": ["Infrastructure IA, data centers, semi-conducteurs et énergie", null], "SEMI": ["Semi-conducteurs, puces et équipements", null], "MRVL": ["Semi-conducteurs, connectivité IA, photonique et data centers", 230], "NBIS": ["Cloud IA, GPU calculs hautes performances et data centers", 170], "POWL": ["Électrification lourde & Matériel Électrique", 160], "PRY": ["Câbles Haute Tension & Réseaux Électriques / Data", 100], "RKLB": ["Spatial, lanceurs, satellites et défense", 50], "NOW": ["Logiciel SaaS Enterprise & IA Opérationnelle", 120], "SKHY": ["Mémoires Haute Performance (HBM pour l'IA)", null], "SPCX": ["Spatial, lanceurs, Starlink et communications", null], "VRT": ["Refroidissement, alimentation électrique et data centers", 200], "VST": ["Production électrique, nucléaire et gaz", 130], "COHR": ["Photonique, lasers et composants optiques", 240], "LITE": ["Photonique, lasers et interconnexions optiques", 800], "TYO:6324": ["Composants de Précision & Réducteurs Robotiques", 4800], "TYO:6954": ["Robots industriels, automatisation et CNC", 5500], "SYM": ["Robotique logistique, automatisation d'entrepôts", 34]}; // secteur et prix d'achat, utilisés si le Sheet n'a pas ces colonnes
const PERIODS = [
  {k:'d1', short:'1 jour',  past:'Il y a 24 h'},
  {k:'m6', short:'6 mois',  past:'Il y a 6 mois'},
  {k:'y1', short:'1 an',    past:'Il y a 1 an'},
  {k:'y3', short:'3 ans',   past:'Il y a 3 ans'}
];
const $ = id => document.getElementById(id);
const store = {
  get:(k,d=null)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
// sort.key : null = ordre du tableau d'origine ; sinon 't' ou une période. dir : 'desc' | 'asc'
let state = { data: [], full: store.get('full')==='1', sort:{key:null,dir:'desc'}, open:null };

/* ---------- format ---------- */
const nfP1 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1,useGrouping:false});
const nfP0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0,useGrouping:false});
const nfPx = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = v => { if(v==null) return 'n/d';
  const a=Math.abs(v)*100; if(a<0.05) return '0,0%';
  return (v>0?'+':'−')+(a>=1000?nfP0:nfP1).format(a)+'%'; };
const fmtPx = v => v==null ? 'n/d' : nfPx.format(v);
const cls = v => v==null ? 'nd' : (v>=0.0005?'up':(v<=-0.0005?'down':'nd'));
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- données ---------- */
const fromRows = rows => rows.map(r=>{
  const key=String(r[0]).replace(/\s+/g,''), m=META[key];
  return { t:key, n:r[1], cur:r[2], old:{d1:r[3], m6:r[4], y1:r[5], y3:r[6]},
    sec: typeof r[7]==='string' ? r[7] : (m?m[0]:''),
    buy: typeof r[8]==='number' ? r[8] : (r[8]==='' ? null : (m?m[1]:null)) };
});
const perf = (it,k) => (it.cur!=null && it.old[k]!=null && it.old[k]!==0) ? (it.cur-it.old[k])/it.old[k] : null;

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell='' }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row) }
  return rows;
}
function num(s){
  if(s==null) return null;
  s=String(s).trim();
  if(!s || /^(n\/?d|#.*|-+|—)$/i.test(s)) return null;
  s=s.replace(/[\s\u00a0\u202f$€£%]/g,'');
  if(s.includes(',')&&s.includes('.')){
    s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(s.includes(',')) s=s.replace(',','.');
  const v=parseFloat(s); return isFinite(v)?v:null;
}
function parseSheet(text){
  const t=text.replace(/^\uFEFF/,'');
  if(/^\s*</.test(t)) throw new Error('le lien renvoie une page web et non du CSV (à la publication, choisis « Valeurs séparées par des virgules »)');
  const rows=parseCSV(t);
  const h=rows.findIndex(r=>/^(ticker|symbole|symbol|code)$/i.test((r[0]||'').trim()));
  const head=h>=0?rows[h].map(x=>(x||'').toLowerCase()):[];
  const start=h>=0?h+1:rows.findIndex(r=>/^[A-Za-z0-9.:^-]{1,14}$/.test((r[0]||'').trim()) && num(r[2])!=null);
  if(start<0) throw new Error('aucune ligne de cours reconnue. Début du fichier : « '+t.slice(0,70).replace(/\s+/g,' ')+' »');
  const find=(re,d)=>{const i=head.findIndex(x=>re.test(x));return i<0?d:i};
  const c={ cur:find(/actuel/,2), d1:find(/24\s*h/,3), m6:find(/il y a 6/,5), y1:find(/il y a 1 an/,7), y3:find(/il y a 3/,9), sec:find(/secteur/,-1), buy:find(/achat/,-1) };
  const out=[];
  for(let i=start;i<rows.length;i++){
    const r=rows[i], tk=(r[0]||'').trim();
    if(!tk) break;
    const bv = c.buy>=0 ? num(r[c.buy]) : undefined;
    out.push([tk,(r[1]||'').trim(),num(r[c.cur]),num(r[c.d1]),num(r[c.m6]),num(r[c.y1]),num(r[c.y3]),
      c.sec>=0 ? (r[c.sec]||'').trim() : undefined,
      c.buy>=0 ? (bv==null?'':bv) : undefined]);
  }
  if(!out.length) throw new Error('aucune ligne de cours');
  return out;
}

const hhmm = d => d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const when = ts => { const d=new Date(ts), now=new Date();
  return d.toDateString()===now.toDateString() ? 'à '+hhmm(d) : 'le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' à '+hhmm(d) };
function setStatus(msg, live){ const s=$('status'); s.textContent=msg; s.className=live?'live':'' }

async function load(){
  const url=store.get('csvUrl')||DEFAULT_CSV;
  $('refresh').classList.add('spin');
  try{
    if(!url){
      state.data=fromRows(SNAPSHOT);
      setStatus('Données intégrées (pas de lien CSV).');
    } else {
      const res=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error('Google répond HTTP '+res.status+(res.status===400||res.status===404?' (lien incorrect ou publication arrêtée)':''));
      const rows=parseSheet(await res.text());
      const ts=Date.now();
      store.set('last',JSON.stringify({ts,rows}));
      store.set('lastLoad',String(ts));
      state.data=fromRows(rows);
      setStatus('En direct, mis à jour '+when(ts),true);
    }
  }catch(e){
    console.error(e);
    const why = e instanceof TypeError ? 'connexion impossible ou accès refusé par Google' : (e&&e.message?e.message:'erreur inconnue');
    const last=JSON.parse(store.get('last','null')||'null');
    if(last){ state.data=fromRows(last.rows); setStatus('Mise à jour impossible : '+why+'. Derniers cours reçus '+when(last.ts)+'.') }
    else { state.data=fromRows(SNAPSHOT); setStatus('Lien CSV illisible : '+why+'. Données intégrées affichées.') }
  }
  $('refresh').classList.remove('spin');
  render();
}

/* ---------- affichage ---------- */
const nfB = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2,useGrouping:false});
const disp = t => t.replace(/^[A-Za-z]+:/,'');

function render(){
  const {sort,full}=state;
  $('tbl').className=full?'full':'';
  $('mode').textContent=full?'Vue compacte':'Tous les prix';

  const arrow=k=>sort.key===k?(sort.dir==='desc'?' ↓':' ↑'):'';
  $('thead').innerHTML='<tr>'+
    `<th class="c1 sortable ${sort.key==='t'?'on':''}" data-s="t">Ticker${arrow('t')}</th>`+
    '<th>Prix</th><th class="bp">Achat reco.</th>'+
    `<th class="gp sortable ${sort.key==='gap'?'on':''}" data-s="gap">Écart achat${arrow('gap')}</th>`+
    PERIODS.map(p=>`<th class="pp">${p.past}</th><th class="sortable ${sort.key===p.k?'on':''}" data-s="${p.k}">${p.short}${arrow(p.k)}</th>`).join('')+
    '<th class="sc">Secteur</th></tr>';

  let rows=state.data.map(it=>{
    const p=Object.fromEntries(PERIODS.map(q=>[q.k,perf(it,q.k)]));
    p.gap=(it.cur!=null&&it.buy)?(it.cur-it.buy)/it.buy:null;
    return {it,p};
  });
  if(sort.key){
    const m=sort.dir==='desc'?-1:1;
    rows.sort((a,b)=>{
      if(sort.key==='t'){ const c=a.it.t.localeCompare(b.it.t); return sort.dir==='asc'?c:-c }
      const x=a.p[sort.key], y=b.p[sort.key];
      if(x==null||y==null) return (x==null)-(y==null);
      return m*(x-y);
    });
  }
  const col={}; PERIODS.forEach(q=>{
    const v=rows.map(r=>r.p[q.k]).filter(x=>x!=null);
    col[q.k]={max:Math.max(0.0001,...v.map(Math.abs)), avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,
              hi:v.length?Math.max(...v):null, lo:v.length?Math.min(...v):null};
  });
  const tint=(v,k)=>{ if(v==null||Math.abs(v)<0.0005) return '';
    const a=(0.07+0.28*Math.sqrt(Math.min(1,Math.abs(v)/col[k].max))).toFixed(2);
    return `style="background:${v>0?`rgba(63,207,142,${a})`:`rgba(255,114,102,${a})`}"`; };

  $('tbody').innerHTML = rows.map(({it,p})=>{
    const zone = it.buy && it.cur!=null && it.cur<=it.buy;
    const isOpen = !full && state.open===it.t;
    const bs = it.buy ? `<span class="bs ${zone?'in':''}">${zone?'✓':'→'} ${nfB.format(it.buy)}</span>` : '';
    let html=`<tr class="${zone?'buyz':''}" data-t="${esc(it.t)}">`+
      `<td class="c1"><b>${esc(disp(it.t))}</b><small>${esc(it.n)}</small></td>`+
      `<td class="px">${fmtPx(it.cur)}${bs}</td>`+
      `<td class="bp">${it.buy?nfB.format(it.buy):''}</td>`+
      `<td class="gp ${p.gap==null?'':(p.gap<=0?'up':'wait')}">${p.gap==null?'':fmtPct(p.gap)}</td>`+
      PERIODS.map(q=>`<td class="pp">${fmtPx(it.old[q.k])}</td><td class="v ${cls(p[q.k])}" ${tint(p[q.k],q.k)}>${fmtPct(p[q.k])}</td>`).join('')+
      `<td class="sc">${esc(it.sec||'')}</td></tr>`;
    if(isOpen && (it.sec||it.buy)){
      const g=p.gap, pctTxt = g==null?'':nfP1.format(Math.abs(g)*100)+' %';
      html+=`<tr class="dt"><td colspan="6"><div>`+
        (it.sec?`<p><span>Secteur</span>${esc(it.sec)}</p>`:'')+
        (it.buy?`<p><span>Achat recommandé</span>${nfB.format(it.buy)}${g==null?'':' · '+(g<=0?`<b class="up">✓ cours ${pctTxt} sous ton prix</b>`:`cours ${pctTxt} au-dessus`)}</p>`:'')+
        `</div></td></tr>`;
    }
    return html;
  }).join('') || '<tr><td class="empty" colspan="6">Aucun cours à afficher.</td></tr>';

  const foot=(label,key)=>`<tr><td class="c1">${label}</td><td></td><td class="bp"></td><td class="gp"></td>`+
    PERIODS.map(q=>`<td class="pp"></td><td class="${cls(col[q.k][key])}">${fmtPct(col[q.k][key])}</td>`).join('')+'<td class="sc"></td></tr>';
  $('tfoot').innerHTML=foot('Moyenne','avg')+foot('Meilleur','hi')+foot('Moins bon','lo');
}

/* ---------- interactions ---------- */
$('thead').addEventListener('click',e=>{
  const th=e.target.closest('th.sortable'); if(!th) return;
  const k=th.dataset.s, s=state.sort;
  // 1er appui : décroissant (A→Z pour le ticker), 2e : inverse, 3e : ordre d'origine
  const first = (k==='t'||k==='gap') ? 'asc' : 'desc';
  if(s.key!==k) state.sort={key:k,dir:first};
  else if(s.dir===first) state.sort={key:k,dir:first==='desc'?'asc':'desc'};
  else state.sort={key:null,dir:'desc'};
  render();
});
$('tbody').addEventListener('click',e=>{
  if(state.full) return;
  const tr=e.target.closest('tr[data-t]'); if(!tr) return;
  state.open = state.open===tr.dataset.t ? null : tr.dataset.t; render();
});
$('mode').addEventListener('click',()=>{ state.full=!state.full; store.set('full',state.full?'1':'0'); render() });
$('refresh').addEventListener('click',load);

const dlg=$('dlg');
$('gear').addEventListener('click',()=>{ $('url').value=store.get('csvUrl')||DEFAULT_CSV; $('err').textContent=''; dlg.showModal() });
$('cancel').addEventListener('click',()=>dlg.close());
$('save').addEventListener('click',()=>{
  const v=$('url').value.trim();
  if(v && !/^https:\/\//i.test(v)){ $('err').textContent='Le lien doit commencer par https://'; return }
  v ? store.set('csvUrl',v) : store.del('csvUrl');
  dlg.close(); load();
});
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close() });

let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; $('install').style.display='block' });
$('install').addEventListener('click',async()=>{ if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null; $('install').style.display='none' });

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && Date.now()-Number(store.get('lastLoad','0'))>5*60*1000) load();
});

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
